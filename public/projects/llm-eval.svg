    <text x="0" y="14" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#f1f5f9">LLM Eval Harness</text>
    <text x="0" y="54" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#94a3b8">Prompt-Regression Testing</text>

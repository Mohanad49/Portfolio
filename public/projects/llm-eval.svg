    <g transform="translate(92,0)"><rect x="0" y="0" width="80" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#0ea5e9" stroke-opacity="0.45"/><text x="40.0" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1">PyTest</text></g>
